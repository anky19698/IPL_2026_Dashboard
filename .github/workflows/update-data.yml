name: Update Cricket Data

on:
  schedule:
    # 02:30 UTC every day — 08:00 IST, after overnight matches are published.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build data
        run: python scripts/build_data.py

      - name: Clean raw cache
        run: rm -rf .cricsheet_raw

      - name: Commit & push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "No data changes today."
          else
            git commit -m "chore: refresh cricket data $(date -u +%Y-%m-%d)"
            git push
          fi
